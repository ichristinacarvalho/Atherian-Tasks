<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Atherian Tasks - Um gerenciador de tarefas gamificado onde sua produtividade dita seus atributos.">

    <link rel="shortcut icon" href="./images/Icon AC.png" type="image/x-icon">
    <!-- bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">

    <!-- Fontes importadas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
        rel="stylesheet">

    <title>Atherian Tasks</title>
</head>

<body>

    <!-- BARRA SUPERIOR DE AUTENTICAÇÃO -->
    <nav class="topbar py-2 px-3 border-bottom">
        <div class="container d-flex justify-content-between align-items-center">

            <a href="#home">
                <img class="topbar__logo" alt="Athera Code" src="./images/Icon AC.png">
            </a>

            <!-- Status do usuário e botões no canto direito -->
            <div class="d-flex align-items-center gap-3">
                <div id="info-usuario" class="d-flex align-items-center gap-2">
                    <span class="text-secondary small">Sessão não iniciada</span>
                </div>

                <div>
                    <button id="btn-login" class="btn btn-sm btn-outline-info">Entrar com Google</button>
                    <button id="btn-logout" class="btn btn-sm btn-outline-danger d-none">Sair</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <header class="hero text-center" id="home">

        <h1 class="hero__title">Atherian Tasks</h1>

        <p class="hero__subtitle">Suba de nível na vida real, uma tarefa por vez.</p>
    </header>

    <!-- Main-->
    <main class="guild container my-5">

        <!-- Painel -->
<section class="status-panel container mt-4 mb-5">
    <div class="row text-center p-3" style="background-color: var(--cor-fundo-cards); border: 1px solid var(--cor-borda-escura); border-radius: 12px;">
        
        <!-- Nível -->
        <div class="col-4">
            <div class="text-secondary small text-uppercase fw-bold" style="letter-spacing: 1px;">Nível</div>
            <div id="status-nivel" class="fs-2 fw-bold" style="color: var(--cor-destaque-ciano);">1</div>
        </div>

        <!-- Experiência (XP) -->
        <div class="col-4 border-start border-end border-secondary">
            <div class="text-secondary small text-uppercase fw-bold" style="letter-spacing: 1px;">Experiência</div>
            <div class="fs-3 fw-bold text-light mt-1">
                <span id="status-xp-atual">0</span> <span class="text-secondary fs-5">/</span> <span id="status-xp-proximo" class="text-secondary fs-5">100</span>
            </div>
        </div>

        <!-- Pontos de Vida (HP) -->
        <div class="col-4">
            <div class="text-secondary small text-uppercase fw-bold" style="letter-spacing: 1px;">Vitalidade</div>
            <div id="status-hp" class="fs-2 fw-bold text-danger">100</div>
        </div>

    </div>
</section>

        <section id="forja-missoes" class="forge mb-5">
            <form id="forja" class="forge__form card p-4 shadow-sm border-0">

                <h2 class="forge__title mb-4 text-center">Balcão da Guilda</h2>

                <div class="mb-3">
                    <label for="missao" class="forge__label form-label fw-bold">Missão:</label>
                    <input type="text" class="forge__input form-control" id="missao" name="missao" required
                        placeholder="ex: Derrotar o Boss do semestre">
                </div>

                <div class="forge__container mb-3">
                    <label for="dificuldade" class="forge__label form-label fw-bold">Dificuldade:</label>
                    <select class="forge__select form-select" name="dificuldade" id="dificuldade" required>
                        <option value="" selected disabled>Selecione a dificuldade</option>
                        <option value="comum">Comum</option>
                        <option value="raro">Raro</option>
                        <option value="lendario">Lendário</option>
                    </select>
                </div>

                <div class="forge__container mb-3">
                    <label for="categoria" class="forge__label form-label fw-bold">Categoria:</label>
                    <select class="forge__select form-select" name="categoria" id="categoria" required>
                        <option value="" selected disabled>Selecione a categoria</option>
                        <option value="guerreiro">Guerreiro (tarefas físicas/esportes)</option>
                        <option value="mago">Mago (estudos/foco)</option>
                        <option value="ladino">Ladino (tarefas domésticas/furtivas)</option>
                        <option value="clerigo">Clérigo (autocuidado/saúde)</option>
                    </select>
                </div>

                <button type="submit" class="forge__button btn w-100 fw-bold py-2">Criar missão</button>
            </form>
        </section>

        <section id="mural-missoes" class="board">

            <h2 class="board__title mb-4 border-bottom pb-2 text-center">Mural de missões</h2>
            <div class="board__container row" id="area-cards"></div>
        </section>
    </main>

    <!-- Footer-->
    <footer class="final text-center">
        <p class="final__title">Atherian Tasks</p>

        <p class="final__phrase">A jornada é longa, mas a recompensa vale a pena. Continue jogando.</p>

        <p class="final__copyright">© 2026 Atherian Tasks</p>
    </footer>

    <!--bootstrap JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./scripts/script.js"></script>
</body>

</html>
